# Gradle 데몬 JVM 설정입니다.
#
# -Dfile.encoding=UTF-8
#   빌드 중 텍스트를 읽고 쓰는 나머지 동작(빌드 스크립트 읽기, 테스트 리포트 생성 등)의
#   기본 문자셋을 고정합니다. 지정하지 않으면 Gradle 을 실행한 JVM 의 기본 문자셋이
#   그대로 데몬에 전달되어, JDK 17 이하로 Gradle 을 띄운 CP949 Windows 에서 갈립니다.
#   소스 컴파일 인코딩은 build.gradle 의 options.encoding 이 담당하며 그쪽이 우선입니다.
#
# -Xms / -Xmx / -XX:
#   Gradle 기본값과 같은 값을 그대로 적어 둔 것입니다.
#   org.gradle.jvmargs 를 지정하면 Gradle 기본값이 통째로 사라지기 때문에 다시 씁니다.
org.gradle.jvmargs=-Xms256m -Xmx512m -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
