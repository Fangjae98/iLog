# 배포(운영) 프로필. docker-compose 의 backend 에 SPRING_PROFILES_ACTIVE=prod 를 주면 켜진다.
# (환경변수가 application.properties 의 spring.profiles.active=local 보다 우선한다)
# DB·JWT·메일 값은 여기 두지 않고 compose 가 넘기는 환경변수로만 받는다.

# API 문서를 외부에 노출하지 않는다. 로컬(local 프로필)에서는 그대로 열려 있다.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
