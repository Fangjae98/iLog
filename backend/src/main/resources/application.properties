spring.application.name=ilog
spring.jpa.hibernate.ddl-auto=update
spring.profiles.active=local

# ───────────────────────────────────────────────────────────
# 이하 BE 파트 설정.
# 위 3줄은 develop(인프라) 소유이므로 건드리지 말고,
# 백엔드 설정은 이 블록 안에만 추가해 주세요.
# be -> develop 머지 시 충돌 범위를 이 블록으로 가두기 위함입니다.
# ───────────────────────────────────────────────────────────

# 시간대: DB timestamp 와 JSON 응답을 KST 로 통일
spring.jackson.time-zone=Asia/Seoul
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# 검증 실패 문구를 한국어로 고정 (G2). Accept-Language 에 따라 영어로 나가지 않게 한다.
# hibernate-validator 의 ValidationMessages_ko.properties 가 기본 문구를 담당한다.
# FIXED 리졸버는 locale 값이 반드시 함께 있어야 한다.
spring.web.locale=ko
spring.web.locale-resolver=fixed

# 영속성 컨텍스트를 뷰 렌더링까지 열어두지 않음 (트랜잭션 밖 지연로딩 차단)
spring.jpa.open-in-view=false

# show-sql 을 켰을 때만 효과가 있음. show-sql 은 application-local.properties 에서
spring.jpa.properties.hibernate.format_sql=true

# JWT accessToken 유효 기간. 리프레시 토큰은 없다.
# 서명 키(ilog.jwt.secret)는 여기에 적지 않는다 (Public 저장소).
#   로컬 실행 : application-local.properties 의 ilog.jwt.secret
#   도커 실행 : 루트 .env 의 JWT_SECRET → docker-compose 가 ILOG_JWT_SECRET 으로 넘긴다
# 32바이트 이상이어야 하고, 없으면 서버가 뜨지 않는다.
ilog.jwt.access-token-validity=2h

# 임시 비밀번호 안내 메일 (AUTH-03, U9: Gmail SMTP + 앱 비밀번호).
# 계정 값은 저장소에 넣지 않는다.
#   로컬 실행 : application-local.properties 의 spring.mail.username / password
#   도커 실행 : 루트 .env 의 MAIL_USERNAME / MAIL_PASSWORD
# 기본값을 비워 두는 이유: 환경변수가 없는 머신에서도 컨텍스트가 떠야 테스트가 돈다.
# 실제 발송은 값이 채워져 있을 때만 성공한다.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Swagger UI: http://localhost:8080/swagger-ui.html  (명세: /v3/api-docs)
# 운영 배포 프로필에서는 아래 두 값을 false 로 내려 문서를 외부에 노출하지 않는다.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-produces-media-type=application/json
