spring.application.name=ilog
spring.jpa.hibernate.ddl-auto=update
spring.profiles.active=local

# ───────────────────────────────────────────────────────────
# 이하 BE 파트 설정.
# 위 3줄은 develop(인프라) 소유이므로 건드리지 말고,
# 백엔드 설정은 이 블록 안에만 추가해 주세요.
# be -> develop 머지 시 충돌 범위를 이 블록으로 가두기 위함입니다.
# ───────────────────────────────────────────────────────────

# 시간대: DB timestamp 와 JSON 응답을 KST 로 통일
spring.jackson.time-zone=Asia/Seoul
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# 영속성 컨텍스트를 뷰 렌더링까지 열어두지 않음 (트랜잭션 밖 지연로딩 차단)
spring.jpa.open-in-view=false

# show-sql 을 켰을 때만 효과가 있음. show-sql 은 application-local.properties 에서
spring.jpa.properties.hibernate.format_sql=true

# 개발용: X-User-Id 헤더로 로그인 회원 주입. 유효한 Bearer 토큰이 있으면 토큰이 우선한다.
# JWT 는 붙었지만 3단계에서 permitAll 을 풀 때까지 켜 둔다 → 그때 false, 이후 삭제
ilog.auth.dev-header-enabled=true

# JWT accessToken 유효 기간. 리프레시 토큰은 없다.
# 서명 키(ilog.jwt.secret)는 여기에 적지 않는다 (Public 저장소).
#   로컬 실행 : application-local.properties 의 ilog.jwt.secret
#   도커 실행 : 루트 .env 의 JWT_SECRET → docker-compose 가 ILOG_JWT_SECRET 으로 넘긴다
# 32바이트 이상이어야 하고, 없으면 서버가 뜨지 않는다.
ilog.jwt.access-token-validity=2h

# Swagger UI: http://localhost:8080/swagger-ui.html  (명세: /v3/api-docs)
# 운영 배포 프로필에서는 아래 두 값을 false 로 내려 문서를 외부에 노출하지 않는다.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-produces-media-type=application/json
