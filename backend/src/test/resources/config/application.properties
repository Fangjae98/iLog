# 테스트 전용 설정. 실제 서비스에는 쓰이지 않는 값만 둡니다.
#
# classpath:/config/ 에 두면 main 의 application.properties 와 "함께" 로드되고 이 값이 덧씌워집니다.
# 테스트 쪽에 같은 이름(classpath:/application.properties)을 두면 main 파일을 통째로 가리므로 쓰지 않습니다.
#
# 단, application-local.properties 가 있으면 그쪽 ilog.jwt.secret 이 우선합니다 (프로필 파일이 이김).
# CI 처럼 로컬 파일이 없는 환경에서 이 값이 쓰입니다.
ilog.jwt.secret=test-only-jwt-secret-0123456789-abcdefghij
